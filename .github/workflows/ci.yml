name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node build/check-release.cjs version
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # pnpm lint is not gated yet: the config is strictTypeChecked and had never
      # run, so it reports 1151 pre-existing errors. See queue task for the cleanup.
      - run: node build/check-release.cjs manifest
      # Report-only: a hard fail on a transitive advisory would block every PR
      # on a timeline nobody here controls (upstream patch release, advisory
      # database update). Findings still show up in the job log/summary.
      - run: pnpm audit
        continue-on-error: true
      - run: pnpm package:all
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
          retention-days: 14
