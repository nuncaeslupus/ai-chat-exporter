<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extensionName">AI Chat Exporter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Fixed 48px header. -->
      <header class="popup-header">
        <img src="../assets/icons/icon-header.svg" alt="" class="header-logo" />
        <div class="header-title">
          <h1 class="popup-title" data-i18n="extensionName">AI Chat Exporter</h1>
          <span class="popup-version" id="popup-version"></span>
        </div>
        <div class="status-indicator" id="status-indicator" role="status">
          <span class="status-dot"></span>
          <span class="status-text" id="status-text" data-i18n="statusDetecting">Detecting...</span>
        </div>
      </header>

      <!--
        Fixed 260px body. Every view and every UI state paints inside this box,
        so the popup is always 310px tall and never jumps. Anything that grows
        scrolls in a `.view-scroll` child, never stretches the box.
      -->
      <main class="popup-body" id="popup-body" data-view="main" data-ui-state="detecting">
        <section class="popup-view" id="view-main">
          <div class="view-scroll">
            <!-- Not supported message -->
            <section class="not-supported-section" id="not-supported-section" style="display: none;">
              <div class="not-supported-message">
                <svg class="not-supported-icon" width="48" height="48" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                  <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h3 class="not-supported-title" data-i18n="noChatbotDetectedTitle">No Chatbot Detected</h3>
                <p class="not-supported-text">
                  <span data-i18n="noChatbotDetectedMessage">This page doesn't appear to have a supported chatbot conversation.</span>
                  <br><br>
                  <strong data-i18n="supportedPlatforms">Supported platforms:</strong>
                  <span id="supported-platforms-list"></span>
                </p>
              </div>
            </section>

            <!-- Main content (shown when supported) -->
            <div id="main-content">
              <!-- Conversation block: title + `platform · N pairs · date range`. -->
              <div class="conversation-block">
                <h2 class="conversation-title" id="conversation-title">-</h2>
                <p class="conversation-meta">
                  <img class="platform-icon" id="platform-icon" alt="" style="display: none;" />
                  <span class="conversation-meta-text" id="conversation-meta"></span>
                </p>
              </div>

            </div> <!-- End main-content -->
          </div>

          <!--
            Setting rows sit outside the scroll area on purpose. Pinning them
            with `margin-top:auto` inside it works only while the conversation
            title is one line; past that they get pushed under the action bar.
            As their own `flex:none` strip they land in the same place and stay
            reachable. Both are pure navigation triggers: `data-nav` is all the
            R1 router needs.
          -->
          <div class="setting-rows">
            <button type="button" class="setting-row" data-nav="content">
              <span class="setting-row-label" data-i18n="rowContent">Content</span>
              <span class="setting-row-spacer"></span>
              <span class="setting-row-value" id="content-row-value"></span>
              <svg class="setting-row-chevron" width="8" height="12" viewBox="0 0 8 12" fill="none" aria-hidden="true">
                <path d="M1.5 1 6.5 6l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="setting-row setting-row--options" data-nav="options">
              <span class="setting-row-label" data-i18n="rowOptions">Options</span>
              <span
                class="setting-row-dot"
                id="options-changed-dot"
                role="img"
                data-i18n-label="rowOptionsChanged"
                hidden
              ></span>
              <span class="setting-row-spacer"></span>
              <svg class="setting-row-chevron" width="8" height="12" viewBox="0 0 8 12" fill="none" aria-hidden="true">
                <path d="M1.5 1 6.5 6l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <!-- Action bar: split export button + print, then the privacy line. -->
          <div class="action-bar">
            <div class="action-row">
              <div class="split-button">
                <button type="button" class="split-export" id="export-button" disabled>
                  <svg class="split-export-icon" width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 1.5v9m0 0 3.2-3.2M8 10.5 4.8 7.3M2.5 14h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span class="split-export-label" id="export-button-label" data-i18n="exportButton">Export</span>
                </button>
                <button
                  type="button"
                  class="split-toggle"
                  id="format-menu-toggle"
                  data-format-menu-toggle
                  data-i18n-label="changeFormatButton"
                >
                  <svg class="split-toggle-chevron" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                    <path d="M1 1.5 6 6.5 11 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <button type="button" class="print-button" id="print-button" data-i18n-label="printButton" disabled>
                <svg class="print-button-icon" width="19" height="19" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M4 5V2h8v3M4 11H2V7h12v4h-2M4 9h8v5H4V9z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p class="privacy-line">
              <svg class="privacy-icon" width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M4 6.5V4.6a3 3 0 0 1 6 0v1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <rect x="2.6" y="6.4" width="8.8" height="6.2" rx="2" stroke="currentColor" stroke-width="1.4"/>
              </svg>
              <span data-i18n="privacyNotice">Generated in your browser. Nothing is sent to any server.</span>
            </p>
          </div>
        </section>

        <!--
          Submenu views. Still unstyled: the router owns visibility, the final
          layouts land with the Content / Options / Filename tasks. What lives
          here now is the pre-redesign markup those tasks take over, parked in
          the view it belongs to so its wiring keeps working meanwhile.
          Anything added here must keep the `.view-scroll` (flex:1) + flex:none
          header/footer shape so it scrolls inside the box.
        -->
        <section class="popup-view" id="view-content" hidden>
          <div class="view-scroll">
            <section class="qa-selection" id="qa-selection-section" style="display: none;">
              <div class="qa-selection-header">
                <span class="qa-selection-title" data-i18n="qaSelectionTitle">Select Q&amp;A pairs to export</span>
                <button type="button" class="qa-selection-toggle-all" id="qa-selection-toggle-all"></button>
              </div>
              <ul class="qa-selection-list" id="qa-selection-list"></ul>
              <div class="qa-selection-count" id="qa-selection-count"></div>
            </section>
          </div>
        </section>

        <section class="popup-view" id="view-options" hidden>
          <div class="view-scroll">
            <div class="settings-grid">
              <label class="setting-item" for="option-include-metadata">
                <input type="checkbox" id="option-include-metadata" />
                <span data-i18n="optionIncludeMetadata">Include metadata</span>
              </label>
              <label class="setting-item" for="option-include-timestamps">
                <input type="checkbox" id="option-include-timestamps" />
                <span data-i18n="optionIncludeTimestamps">Include timestamps</span>
              </label>
            </div>
          </div>

          <footer class="popup-footer">
            <a
              href="https://github.com/nuncaeslupus/ai-chat-exporter"
              target="_blank"
              class="footer-link"
              data-i18n="footerGitHub"
            >
              GitHub
            </a>
            <span class="footer-separator">•</span>
            <a href="#" class="footer-link" id="report-issue" data-i18n="footerReportIssue">Report Issue</a>
          </footer>
        </section>

        <section class="popup-view" id="view-filename" hidden></section>
      </main>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
