<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extensionName">AI Chat Exporter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <img src="../assets/icons/icon-128.png" alt="Logo" class="header-logo" />
        <div class="header-title">
          <h1 class="popup-title" data-i18n="extensionName">AI Chat Exporter</h1>
          <span class="popup-version">v1.0.0</span>
        </div>
        <div class="status-indicator" id="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text" id="status-text" data-i18n="statusDetecting">Detecting...</span>
        </div>
      </header>

      <main class="popup-main">
        <!-- Not supported message -->
        <section class="not-supported-section" id="not-supported-section" style="display: none;">
          <div class="not-supported-message">
            <svg class="not-supported-icon" width="48" height="48" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h3 class="not-supported-title" data-i18n="noChatbotDetectedTitle">No Chatbot Detected</h3>
            <p class="not-supported-text">
              <span data-i18n="noChatbotDetectedMessage">This page doesn't appear to have a supported chatbot conversation.</span>
              <br><br>
              <strong data-i18n="supportedPlatforms">Supported platforms:</strong>
              <span id="supported-platforms-list"></span>
            </p>
          </div>
        </section>

        <!-- Main content (shown when supported) -->
        <div id="main-content">
        <!-- Conversation info -->
        <div class="conversation-info">
          <div class="conversation-header">
            <img class="platform-icon" id="platform-icon" alt="Platform" style="display: none;" />
            <div class="conversation-title" id="conversation-title">-</div>
          </div>
          <div class="conversation-meta" id="conversation-meta">-</div>
        </div>

        <!-- Export controls -->
        <div class="export-controls">
          <div class="format-select-wrapper">
            <img src="../assets/icons/md-icon.svg" alt="" class="format-icon" id="format-icon" />
            <select class="format-select" id="format-select" disabled>
              <option value="md" data-i18n="formatMarkdown">Markdown</option>
              <option value="html" data-i18n="formatHTML">HTML Document</option>
              <option value="pdf" data-i18n="formatPDF">PDF Document</option>
              <option value="docx" data-i18n="formatDOCX">Word Document</option>
              <option value="txt" data-i18n="formatTXT">Plain Text</option>
              <option value="json" data-i18n="formatJSON">JSON Data</option>
            </select>
          </div>
          <div class="button-row">
            <button class="action-button" id="export-button" disabled>
              <svg class="button-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 1v10M8 11l3-3M8 11l-3-3M2 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label" data-i18n="exportButton">Export</span>
            </button>
            <button class="action-button" id="print-button" disabled>
              <svg class="button-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 5V2h8v3M4 11H2V7h12v4h-2M4 9h8v5H4V9z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label" data-i18n="printButton">Print</span>
            </button>
          </div>
        </div>
        </div> <!-- End main-content -->
      </main>

      <footer class="popup-footer">
        <a
          href="https://github.com/nuncaeslupus/ai-chat-exporter"
          target="_blank"
          class="footer-link"
          data-i18n="footerGitHub"
        >
          GitHub
        </a>
        <span class="footer-separator">•</span>
        <a href="#" class="footer-link" id="report-issue" data-i18n="footerReportIssue">Report Issue</a>
      </footer>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
