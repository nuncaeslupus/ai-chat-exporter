<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chat balloon with white fill and green border (ChatGPT) -->

  <!-- Main bubble outline -->
  <path d="M 18 8
           L 110 8
           Q 120 8 120 18
           L 120 92
           Q 120 102 110 102
           L 73 102
           L 55 122
           L 55 102
           L 18 102
           Q 8 102 8 92
           L 8 18
           Q 8 8 18 8 Z"
        fill="white"
        stroke="#10a37f"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Export arrow (green) -->
  <g>
    <!-- Arrow shaft -->
    <rect x="60" y="30" width="8" height="32" rx="2" fill="#10a37f"/>

    <!-- Arrow head pointing down -->
    <path d="M 64 66 L 50 52 L 56 52 L 64 60 L 72 52 L 78 52 Z"
          fill="#10a37f"/>

    <!-- Horizontal line at bottom (export destination indicator) -->
    <rect x="48" y="72" width="32" height="5" rx="2.5" fill="#10a37f"/>
  </g>
</svg>
