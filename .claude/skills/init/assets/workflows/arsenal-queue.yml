# arsenal queue — the queue's state transitions, run by GitHub.
#
# `/init` installs this at .github/workflows/arsenal-queue.yml. Its whole
# purpose is that none of the work below depends on a session being alive to do
# it. A merged PR closes its task through the `Closes #<issue>` keyword that
# `open_task_pr.sh` writes; this file covers everything that keyword cannot:
#
#   pr-closed     a merged PR whose keyword never fired closes its task anyway;
#                 a PR closed WITHOUT merging releases the claim, so the task
#                 goes back on the board instead of looking permanently taken.
#   sync-handles  a task file merged to the default branch gets its issue handle
#                 immediately, so the next session finds a complete board rather
#                 than a chore list.
#   sweep-claims  a claim held with no open PR for a day belonged to a session
#                 that crashed; it is released. The same job deletes the claim
#                 refs of tasks that are finished — a sandboxed session is
#                 refused every ref write by its proxy, so a prune that depends
#                 on one is a prune most consumers can never run.
#   keyword-guard a task PR that would merge without closing anything fails its
#                 check BEFORE the merge, not after.
#
# Delete this file if you would rather run those steps by hand — the queue still
# works, it just goes back to needing a tidy end to every session.
#
# What it bills (#463). Every trigger below is one a job needs: `pull_request_target`
# is the only event that sees a PR closed WITHOUT merging, with a token that may
# write; `push` is the only one that sees a task file land by any route, a direct
# push included. What keeps them cheap is that a job whose `if:` is false never
# gets a runner, and a skipped job bills nothing — an ordinary PR closing, or a
# push to a feature branch, shows up as a skipped run and costs zero minutes.
# What does bill is keyword-guard, once per push to a task PR, because a pushed
# commit can carry the `Closes` line. A draft cannot merge, so the guard waits
# for `ready_for_review`; a newer push cancels the older run instead of queueing
# behind it; and every job has a timeout, so a hung runner costs minutes, not
# hours. The host's own CI is where the real saving is:
# claude-arsenal/references/ci-minutes.md.
#
# Permissions: `issues: write` to close/label/comment on task issues,
# `contents: write` so pr-closed can archive a merged task file that its PR did
# not archive itself, and so sweep-claims can delete a finished task's claim ref.
# It never checks out or runs code from a pull request.

name: arsenal queue

on:
  pull_request_target:
    types: [closed]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches-ignore: ['arsenal/**']
    paths: ['arsenal/tasks/**']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: arsenal-queue-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Only the read-only guard is superseded by a newer event on the same PR; the
  # jobs that write to the board always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-closed:
    name: close or release the task
    # Only PRs that could belong to a task: every other closed PR in the repo
    # would otherwise pay for a checkout to be told it is not one.
    # The head-repo check is load-bearing, not hygiene: this job runs on
    # `pull_request_target` with `issues: write`, and both signals below —
    # the head ref and the PR body — are things a fork author writes. Without
    # it, a fork PR closed without merging reaches `release-claim` and strips
    # a claim another session legitimately holds.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository && (
        startsWith(github.event.pull_request.head.ref, 'arsenal/') ||
        contains(github.event.pull_request.body, 'arsenal-task:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      # The BASE ref, never the PR head: this job runs with a write token, so it
      # must not execute code the pull request could have changed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Apply the merge (or the abandonment) to the queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 claude-arsenal/scripts/queue_hooks.py pr-closed

  sync-handles:
    name: open issues for new task files
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create any missing issue handle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 claude-arsenal/scripts/queue_hooks.py sync-handles

  sweep-claims:
    name: release abandoned claims, prune finished ones
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Longer than the rest: the first prune on an old board deletes one ref per
    # task ever claimed, one API call each.
    timeout-minutes: 15
    permissions:
      # write, not read: the prune below deletes refs.
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release claims with no open PR behind them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 claude-arsenal/scripts/queue_hooks.py sweep-claims --max-age-hours 24
      # The claim ref of a finished task is not a lock any more, it is litter —
      # roughly one per task ever claimed. This is the only place the bundle can
      # sweep it: the proxy in front of a sandboxed session refuses every ref
      # write, by git and by API alike, so "prune from a CLI session" was advice
      # a web-only consumer had no way to take.
      - name: Delete the claim refs of finished tasks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 claude-arsenal/scripts/queue_hooks.py prune-claims

  keyword-guard:
    name: task PR closes its task
    # The branch name is only one of the two ways a PR names its task: check_keyword
    # also resolves `arsenal-task: <id>` out of the PR body, which is how a task PR
    # opened by hand identifies itself. Gating solely on the branch prefix let such
    # a PR merge without anyone checking that its `Closes #...` names the task's own
    # issue — so it could close an unrelated one.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (startsWith(github.head_ref, 'arsenal/') ||
       contains(github.event.pull_request.body, 'arsenal-task:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The BASE ref, never the PR head: this reads the queue's own task files
      # to resolve which issue the PR must close, so it must not run a version
      # of them the pull request could have rewritten.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.base_ref }}
      - name: Require the Closes keyword to name THIS task's issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The base ref is where the queue's own task files live, and on the PR
          # that INSTALLS the bundle the base does not have them yet: the script
          # arrives with the very pull request being guarded. Running it there
          # failed the check with "can't open file", which reads as a broken PR
          # rather than as a queue that does not exist yet. There is nothing to
          # guard against in that case — no task files, so no task issue a
          # `Closes` line could get wrong.
          if [ ! -f claude-arsenal/scripts/queue_hooks.py ]; then
            echo "arsenal is not installed on ${GITHUB_BASE_REF:-the base ref} yet — nothing to guard"
            exit 0
          fi
          python3 claude-arsenal/scripts/queue_hooks.py keyword-guard
